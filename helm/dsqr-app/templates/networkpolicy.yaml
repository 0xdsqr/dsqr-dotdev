apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsqr-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dsqr-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: shared
              gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq .Values.application "dotdev" }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.database.address | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    {{- end }}
