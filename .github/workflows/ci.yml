name: Check

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base revision used by the affected-app planner
        required: false
        type: string
      release_candidate:
        description: Validate a generated Changesets release candidate
        default: false
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: check-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      any: ${{ steps.plan.outputs.any }}
      gitops: ${{ steps.plan.outputs.gitops }}
      helm: ${{ steps.plan.outputs.helm }}
      infra: ${{ steps.plan.outputs.infra }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release_only: ${{ steps.plan.outputs.release_only }}
      workspace_typecheck: ${{ steps.plan.outputs.workspace_typecheck }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="$PULL_REQUEST_BASE_SHA"
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            push)
              base="$EVENT_BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-parse HEAD^)"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$DISPATCH_BASE_SHA" ]]; then
                base="$DISPATCH_BASE_SHA"
              else
                git fetch --no-tags origin master:refs/remotes/origin/master
                if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
                  base="$(git rev-parse HEAD^)"
                else
                  base="$(git merge-base HEAD refs/remotes/origin/master)"
                fi
              fi
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Compute affected app matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          nix run .#ciPlan -- \
            --base "${{ steps.base.outputs.sha }}" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT" \
            --json |
            tee "$RUNNER_TEMP/ci-plan.json"

      - name: Summarize plan
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## CI plan"
            echo
            echo "- Base: \`${{ steps.base.outputs.sha }}\`"
            echo "- Head: \`$GITHUB_SHA\`"
            echo "- Release-only: \`${{ steps.plan.outputs.release_only }}\`"
            echo "- Workspace typecheck: \`${{ steps.plan.outputs.workspace_typecheck }}\`"
            echo
            if [[ -f "$RUNNER_TEMP/ci-plan.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/ci-plan.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Prepare dependency closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - plan

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Realize dependency closure
        run: nix build .#nodeModules --no-link --print-build-logs

      - name: Record cache backend
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Dependency closure"
            echo
            echo "The shared FlakeHub cache is configured with GitHub Actions cache fallback."
            echo
            echo '```'
            nix config show | grep -E '^(substituters|trusted-public-keys)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  base-checks:
    name: Base checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - plan
      - dependencies

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run static and infrastructure checks
        run: |
          nix build \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.ci-plan \
            .#checks.x86_64-linux.dependency-policy \
            .#checks.x86_64-linux.lint \
            .#checks.x86_64-linux.helm \
            .#checks.x86_64-linux.gitops \
            .#checks.x86_64-linux.infra-smoke \
            .#checks.x86_64-linux.release-versioning \
            .#checks.x86_64-linux.security-boundaries \
            .#checks.x86_64-linux.typecheck-infra-native \
            .#checks.x86_64-linux.workflows

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - dependencies

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Reject moderate, high, and critical advisories
        run: nix run .#securityAudit

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          build-mode: none
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  changeset-status:
    name: Changeset status
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - dependencies
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref != 'changeset-release/master'
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Validate pending release intent
        run: nix run .#changeset -- status --since "${{ github.event.pull_request.base.sha }}"

  release-candidate-provenance:
    name: Release candidate provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'changeset-release/master'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/changeset-release/master' &&
          inputs.release_candidate
        )
      }}
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release base revision
        id: release-base
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$DISPATCH_BASE_SHA"
          fi
          if [[ -z "$base" ]]; then
            echo "Release candidate validation requires an explicit base revision." >&2
            exit 1
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable release candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE_REVISION: ${{ steps.release-base.outputs.sha }}
          RELEASE_REGISTRY_OWNER: ${{ github.repository_owner }}
        run: >-
          nix run
          "github:$GITHUB_REPOSITORY/$RELEASE_BASE_REVISION#releaseVerifyCandidates"
          --

  typecheck-workspace:
    name: Typecheck workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - plan
      - dependencies
    if: ${{ needs.plan.outputs.workspace_typecheck == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run workspace typecheck
        run: nix build .#checks.x86_64-linux.typecheck

  build-app:
    name: Build ${{ matrix.imageName }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs:
      - plan
      - dependencies
    if: ${{ needs.plan.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build app checks and image
        shell: bash
        run: |
          set -euo pipefail
          nix build \
            ".#checks.x86_64-linux.runtime-smoke-${{ matrix.app }}" \
            ".#checks.x86_64-linux.image-runtime-${{ matrix.app }}" \
            --no-link \
            --print-build-logs
          nix build ".#${{ matrix.image }}" --out-link result-image

      - name: Smoke-test exact OCI image
        shell: bash
        run: |
          set -euo pipefail
          docker load < result-image
          bash nix/lib/smoke-oci-image.sh \
            "${{ matrix.imageName }}:latest" \
            "${{ matrix.port }}" \
            "${{ matrix.smokePath }}"

      - name: Summarize app build
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## ${{ matrix.imageName }}"
            echo
            echo "- Planner reason: \`${{ matrix.reasons }}\`"
            echo "- Image: \`${{ matrix.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - plan
      - dependencies
      - base-checks
      - dependency-security
      - codeql
      - changeset-status
      - release-candidate-provenance
      - typecheck-workspace
      - build-app

    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "One or more required jobs failed or were cancelled: $RESULTS" >&2
            exit 1
          fi
          echo "All applicable checks completed successfully: $RESULTS"
